name: Analytics quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "phase1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax and SNB regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py run.py snb_comprehensive.py snb_performance.py
      - name: Run synthetic-data regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
