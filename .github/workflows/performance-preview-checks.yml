name: Isolated performance preview checks

on:
  push:
    branches:
      - "preview/snb-performance-redesign"
  pull_request:
    branches: [main]
    paths:
      - "performance_preview.py"
      - "preview_reporting.py"
      - "preview_tests/**"
      - ".github/workflows/performance-preview-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application libraries
        run: python -m pip install -r requirements.txt
      - name: Check preview and existing report syntax
        run: python -m compileall -q performance_preview.py preview_reporting.py snb_performance.py snb_comprehensive.py
      - name: Check synthetic preview regression and Streamlit startup
        run: python -m unittest discover -s preview_tests -p "test_*.py" -v
